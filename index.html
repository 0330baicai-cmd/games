<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>游戏收集箱 · Game Shelf</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;background:radial-gradient(circle at 50% 0%,#122a52,#060912 65%);
    color:#e8f2ff;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:clamp(20px,5vw,64px);
  }
  .wrap{max-width:1080px;margin:0 auto}
  header{margin-bottom:34px}
  h1{font-size:clamp(26px,4vw,40px);letter-spacing:.06em;
     background:linear-gradient(90deg,#8be9ff,#b39dff 60%,#ff9ad2);
     -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
  .sub{margin-top:10px;color:#8fa7c8;font-size:14px;letter-spacing:.04em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:28px}
  a.card{
    display:block;text-decoration:none;color:inherit;border-radius:16px;overflow:hidden;
    background:rgba(18,30,52,.72);border:1px solid rgba(120,180,255,.18);
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  a.card:hover{transform:translateY(-4px);border-color:rgba(140,220,255,.55);
    box-shadow:0 14px 40px rgba(60,150,255,.18)}
  .cover{aspect-ratio:16/10;background:#0b1424 center/cover no-repeat;position:relative}
  .cover::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(6,10,20,0) 40%,rgba(6,10,20,.75))}
  .meta{padding:14px 16px 18px}
  .meta b{font-size:16px;letter-spacing:.04em}
  .meta p{margin-top:6px;font-size:12.5px;line-height:1.6;color:#93a9c8}
  .tag{display:inline-block;margin-top:10px;font-size:11px;padding:3px 9px;border-radius:999px;
    border:1px solid rgba(140,220,255,.35);color:#a9dcff;background:rgba(120,200,255,.08)}
  .empty{margin-top:28px;padding:28px;border-radius:16px;text-align:center;color:#7f96b8;
    border:1px dashed rgba(120,180,255,.25);font-size:13px}
  footer{margin-top:44px;color:#5f7391;font-size:12px;line-height:1.9}
  footer code{color:#9ec6ff;background:rgba(120,180,255,.08);padding:1px 6px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>游戏收集箱</h1>
    <div class="sub">这里放我做过的游戏 · 点开就能玩，手机也能横屏玩</div>
  </header>

  <div class="grid">
    <a class="card" href="arena-smash/">
      <div class="cover" style="background-image:url(arena-smash/cover.png)"></div>
      <div class="meta">
        <b>圆环大乱斗 · Arena Smash</b>
        <p>3D 圆形擂台对战，100% 起有概率一击打飞出局。12 个角色、3 个技能、大招充能。</p>
        <span class="tag">3D 对战 · 单人/同屏双人/观战</span>
      </div>
    </a>
  </div>

  <div class="empty">以后做的新游戏，加一个文件夹 + 上面这样一张卡片就行</div>

  <footer>
    单文件架构：每个游戏都是一个独立 HTML，不依赖服务器，离线也能玩。<br>
    添加新游戏：新建 <code>your-game/index.html</code>，再复制一张卡片改标题和链接。
  </footer>
</div>
</body>
</html>
